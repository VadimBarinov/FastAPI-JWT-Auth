services:
  api:
    build: .
    container_name: bearer_test_api
    ports:
      - 8080:8080
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 512M
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    restart: always
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    container_name: postgres_bearer_test_api
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwerty1234
      POSTGRES_DB: bearer_test_api
      PGDATA: /var/lib/postgresql/data/pgdata_bearer_test_api
    ports:
      - "5432:5432"
    volumes:
      - pgdata_bearer_test_api:/var/lib/postgresql/data/pgdata_bearer_test_api
      - ./db/:/docker-entrypoint-initdb.d/
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    restart: always
    tty: true
    stdin_open: true

volumes:
  pgdata_bearer_test_api: